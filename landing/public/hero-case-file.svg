<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172561"/><stop offset="1" stop-color="#0a1130"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Application -->
  <g transform="translate(300 170) rotate(-4)" filter="url(#sh)">
    <rect width="520" height="700" rx="4" fill="#f4f6fb"/>
    <rect width="520" height="70" fill="#111a3f"/>
    <text x="30" y="44" fill="#f4f6fb" font-size="22" font-family="Arial, sans-serif" font-weight="700">APPLICATION FORM</text>
    <text x="30" y="118" fill="#56618f" font-size="15" font-family="Arial, sans-serif">Applicant name</text>
    <rect x="26" y="130" width="250" height="44" fill="#f6b92b" fill-opacity="0.35"/>
    <text x="34" y="162" fill="#111a3f" font-size="30">Ramesh Kumar</text>
    <text x="30" y="226" fill="#56618f" font-size="15" font-family="Arial, sans-serif">Benefit applied for</text>
    <text x="30" y="258" fill="#111a3f" font-size="24">BOCW Education Assistance</text>
    <text x="30" y="318" fill="#56618f" font-size="15" font-family="Arial, sans-serif">Application no.</text>
    <text x="30" y="350" fill="#111a3f" font-size="24">APP-2026-118432</text>
    <g stroke="#cfd6ea" stroke-width="2"><path d="M30 420H490M30 470H490M30 520H490M30 570H400"/></g>
    <text x="30" y="660" fill="#8a94bd" font-size="14" font-family="Arial, sans-serif">SYNTHETIC DEMO DOCUMENT</text>
  </g>

  <!-- Bank passbook -->
  <g transform="translate(1040 300) rotate(3)" filter="url(#sh)">
    <rect width="560" height="420" rx="4" fill="#e8ecf6"/>
    <rect width="560" height="64" fill="#20317c"/>
    <text x="30" y="41" fill="#f4f6fb" font-size="21" font-family="Arial, sans-serif" font-weight="700">DEMO COOPERATIVE BANK</text>
    <text x="30" y="118" fill="#56618f" font-size="15" font-family="Arial, sans-serif">Account holder</text>
    <rect x="26" y="130" width="170" height="44" fill="#ff6f61" fill-opacity="0.3"/>
    <text x="34" y="162" fill="#111a3f" font-size="30">Ramesh K.</text>
    <text x="30" y="226" fill="#56618f" font-size="15" font-family="Arial, sans-serif">Account no.</text>
    <text x="30" y="258" fill="#111a3f" font-size="24">XXXXXX4417</text>
    <text x="30" y="380" fill="#8a94bd" font-size="14" font-family="Arial, sans-serif">SYNTHETIC DEMO DOCUMENT</text>
  </g>

  <!-- Returned notice -->
  <g transform="translate(1180 660) rotate(-2)" filter="url(#sh)">
    <rect width="470" height="300" rx="4" fill="#f4f6fb"/>
    <text x="28" y="50" fill="#111a3f" font-size="21" font-family="Arial, sans-serif" font-weight="700">NOTICE RN-2026-055219</text>
    <text x="28" y="96" fill="#111a3f" font-size="22">Bank-related document</text>
    <text x="28" y="128" fill="#111a3f" font-size="22">requires correction.</text>
    <g transform="translate(250 150) rotate(-10)">
      <rect width="190" height="70" rx="6" fill="none" stroke="#c23a2e" stroke-width="5"/>
      <text x="95" y="48" text-anchor="middle" fill="#c23a2e" font-size="34" font-family="Arial, sans-serif" font-weight="800">RETURNED</text>
    </g>
  </g>

  <!-- Mismatch link -->
  <path d="M560 300 C 760 120, 1020 140, 1120 300" fill="none" stroke="#f6b92b" stroke-width="4" stroke-dasharray="4 12" stroke-linecap="round"/>
  <g transform="translate(700 150)">
    <rect width="290" height="62" rx="31" fill="#0a1130" stroke="#f6b92b" stroke-width="2"/>
    <text x="145" y="40" text-anchor="middle" fill="#f6b92b" font-size="24" font-family="Arial, sans-serif" font-weight="700">Ramesh Kumar ≠ Ramesh K.</text>
  </g>
</svg>
